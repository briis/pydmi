name: "Release"

# Publishes pydmi-weather to PyPI when a GitHub release is published.
# Uses PyPI Trusted Publishing (OIDC) - no API token is stored in GitHub.

on:
  release:
    types:
      - "published"

permissions: {}

jobs:
  publish:
    name: "Build and publish to PyPI"
    runs-on: "ubuntu-latest"
    environment:
      name: "pypi"
      url: "https://pypi.org/project/pydmi-weather/"
    permissions:
      contents: read
      id-token: write # required for Trusted Publishing
    steps:
      - name: "Checkout the repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Set up Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: "Check that the tag matches __version__"
        shell: "bash"
        run: |
          tag="${{ github.event.release.tag_name }}"
          tag="${tag#v}"
          version=$(python -c "import ast,pathlib;t=ast.parse(pathlib.Path('src/pydmi/const.py').read_text());print(next(n.value.value for n in ast.walk(t) if isinstance(n,ast.AnnAssign) and getattr(n.target,'id','')=='__version__'))")
          echo "Release tag: ${tag}  __version__: ${version}"
          if [ "${tag}" != "${version}" ]; then
            echo "::error::Release tag ${tag} does not match __version__ ${version} in src/pydmi/const.py"
            exit 1
          fi

      - name: "Run tests"
        run: |
          python -m pip install -e ".[test]"
          python -m pytest -q

      - name: "Build"
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: "Publish to PyPI"
        uses: pypa/gh-action-pypi-publish@release/v1
